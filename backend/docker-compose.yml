version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: aurora_postgres
    environment:
      POSTGRES_DB: aurora_db
      POSTGRES_USER: aurora_user
      POSTGRES_PASSWORD: aurora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    # command: overrides the Dockerfile CMD, so it needs its own
    # "migrate, then serve" step too. No --reload: a reloader watches a dev
    # tree and cannot fan out across several worker processes.
    #
    # API_WORKERS is the in-container process count. To run several API
    # containers instead, put a load balancer in front and stop publishing
    # 8000 directly; the shared flight store and rate limiter live in Redis,
    # so replicas can serve any request.
    command: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4} --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aurora_user:aurora_password@postgres:5432/aurora_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "True"
      API_WORKERS: ${API_WORKERS:-4}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Keep API_WORKERS * (pool + overflow) below Postgres max_connections.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    volumes:
      - .:/app
    restart: unless-stopped
    # Drain in-flight requests on deploy instead of dropping connections.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    # No published port and no fixed container name, so the RQ consumers
    # scale horizontally: `docker compose up -d --scale worker=4`.
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://aurora_user:aurora_password@postgres:5432/aurora_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "True"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    volumes:
      - .:/app
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
