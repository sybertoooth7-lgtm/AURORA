name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.3
        env:
          POSTGRES_DB: aurora_db
          POSTGRES_USER: aurora_user
          POSTGRES_PASSWORD: aurora_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora_user -d aurora_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aurora_user:aurora_password@localhost:5432/aurora_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-that-is-long-enough
      ENVIRONMENT: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest
